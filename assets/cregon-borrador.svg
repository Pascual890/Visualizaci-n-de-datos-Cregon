<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="'IM Fell English', Georgia, serif">
  <!--
    BORRADOR del mapa. Sustituir por el dibujo definitivo manteniendo la
    estructura: un <path> por región con id="region-<nombre>" y data-nombre,
    y una capa <g id="marcadores"> vacía donde el JS coloca los lugares.
    Los marcadores (data/mapa-lugares.json) usan las coordenadas de este viewBox.
  -->
  <defs>
    <pattern id="olas" width="26" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 8 Q6.5 2 13 8 T26 8" fill="none" stroke="#2b1d0e" stroke-opacity=".18" stroke-width="1"/>
    </pattern>
    <pattern id="ruinas" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#2b1d0e" stroke-opacity=".28" stroke-width="1.5"/>
    </pattern>
  </defs>

  <!-- mar -->
  <rect width="1000" height="520" fill="url(#olas)"/>

  <!-- ===== Reino vencido en la guerra (nombre pendiente) ===== -->
  <g id="reino-vencido">
    <path id="region-vencido" data-nombre="Reino vencido (nombre pendiente)"
          d="M20 90 L120 60 L215 95 L245 170 L235 260 L190 330 L120 380 L40 340 L15 250 Z"
          fill="#d9cdb0" stroke="#2b1d0e" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M20 90 L120 60 L215 95 L245 170 L235 260 L190 330 L120 380 L40 340 L15 250 Z"
          fill="url(#ruinas)" stroke="none" pointer-events="none"/>
    <!-- montañas de la frontera -->
    <g fill="none" stroke="#2b1d0e" stroke-opacity=".7" stroke-width="1.3" pointer-events="none">
      <path d="M225 120 l10 -16 l10 16 M240 150 l10 -16 l10 16 M232 185 l10 -16 l10 16 M240 220 l10 -16 l10 16 M228 255 l10 -16 l10 16 M215 290 l10 -16 l10 16"/>
    </g>
    <g fill="#2b1d0e" text-anchor="middle" pointer-events="none">
      <text x="125" y="205" font-size="15" font-style="italic">Reino vencido</text>
      <text x="125" y="223" font-size="11" fill="#6e5a45">nombre pendiente</text>
      <text x="125" y="240" font-size="11" fill="#6e5a45">derrotado en la guerra de 1207–1210</text>
    </g>
  </g>

  <!-- ===== Cregon ===== -->
  <g id="cregon" transform="translate(190 0)">
    <!-- regiones (el JS las colorea) -->
    <g id="regiones" stroke="#2b1d0e" stroke-width="1.5" stroke-linejoin="round" fill="#e9dcbf">
      <path id="region-norte"  data-nombre="Tierras altas de Vareck"
            d="M215 60 L330 42 L450 58 L540 95 L520 170 L440 200 L350 190 L270 210 L205 160 Z"/>
      <path id="region-valle"  data-nombre="Valle de Vandel"
            d="M205 160 L270 210 L350 190 L440 200 L430 290 L360 320 L280 310 L200 270 Z"/>
      <path id="region-costa"  data-nombre="Costa de Voss"
            d="M520 170 L610 200 L640 290 L590 380 L500 400 L450 350 L430 290 L440 200 Z"/>
      <path id="region-aldeas" data-nombre="Aldeas del sur"
            d="M200 270 L280 310 L360 320 L430 290 L450 350 L400 430 L300 450 L215 400 L170 330 Z"/>
      <path id="region-bosque" data-nombre="Baldíos y bosque"
            d="M110 200 L205 160 L200 270 L170 330 L120 300 L90 250 Z"/>
    </g>

    <!-- ríos y caminos, solo decorativos -->
    <g fill="none" stroke="#2b1d0e" stroke-opacity=".45" stroke-width="1.2" pointer-events="none">
      <path d="M300 60 C310 120 280 160 330 200 C370 230 340 280 380 320 C400 350 370 400 400 430"/>
      <path d="M215 160 L350 190 L440 200 L520 170" stroke-dasharray="4 4"/>
      <path d="M350 190 L360 320" stroke-dasharray="4 4"/>
    </g>

    <!-- nombres de las regiones -->
    <g fill="#2b1d0e" font-size="15" font-style="italic" text-anchor="middle" pointer-events="none">
      <text x="370" y="125">Tierras altas de Vareck</text>
      <text x="315" y="260">Valle de Vandel</text>
      <text x="545" y="300">Costa de Voss</text>
      <text x="310" y="385">Aldeas del sur</text>
      <text x="150" y="245" font-size="12">Baldíos</text>
      <text x="150" y="261" font-size="12">y bosque</text>
    </g>

    <!-- capa para símbolos estadísticos (círculos), en coordenadas de Cregon -->
    <g id="simbolos"></g>
  </g>

  <!-- capa para los marcadores del mapa de ubicación (coordenadas del viewBox) -->
  <g id="marcadores"></g>

  <!-- rosa de los vientos -->
  <g transform="translate(920 80)" fill="#2b1d0e" stroke="#2b1d0e" pointer-events="none">
    <circle r="28" fill="none" stroke-width="1"/>
    <path d="M0 -40 L6 0 L0 40 L-6 0 Z" stroke="none"/>
    <path d="M-40 0 L0 6 L40 0 L0 -6 Z" stroke="none" fill-opacity=".45"/>
    <text y="-46" font-size="14" text-anchor="middle" stroke="none" font-family="'Cinzel', serif">N</text>
  </g>

  <!-- cartela -->
  <g transform="translate(30 440)" pointer-events="none">
    <rect width="250" height="52" fill="#f3e9d2" stroke="#2b1d0e" stroke-width="1"/>
    <text x="125" y="22" font-size="15" text-anchor="middle" font-family="'Cinzel', serif" fill="#2b1d0e">REINO DE CREGON</text>
    <text x="125" y="41" font-size="11" text-anchor="middle" font-style="italic" fill="#6e5a45">borrador · se sustituirá por el mapa dibujado</text>
  </g>
</svg>
