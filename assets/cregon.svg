<svg xmlns="http://www.w3.org/2000/svg" viewBox="-220 0 1160 800" font-family="'IM Fell English', Georgia, serif">
  <!--
    Mapa del reino de Cregon. Contorno con id="reino"; el JS coloca las ciudades
    (data/mapa-ciudades.json, coordenadas de este viewBox) en la capa #ciudades.
  -->
  <defs>
    <pattern id="olas" width="26" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 8 Q6.5 2 13 8 T26 8" fill="none" stroke="#2b1d0e" stroke-opacity=".14" stroke-width="1"/>
    </pattern>
    <pattern id="ruinas" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#2b1d0e" stroke-opacity=".22" stroke-width="1.5"/>
    </pattern>
    <filter id="sombra" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="6" dy="8" stdDeviation="6" flood-color="#2b1d0e" flood-opacity=".28"/>
    </filter>
  </defs>

  <!-- fondo (tierras de fuera del reino, sin dibujar) -->
  <rect x="-220" width="1160" height="800" fill="url(#olas)"/>


  <!-- reino vecino, vencido en la guerra de 1207-1210 (debajo de Cregon) -->
  <g id="reino-vecino">
    <path d="M166.4 50.0 L139.4 55.0 L135.2 84.3 L122.7 98.9 L120.3 112.7 L126.2 116.5 L127.1 129.1 L145.8 164.1 L136.4 189.2 L127.0 188.6 L116.6 205.4 L84.4 204.1 L90.7 221.0 L90.2 236.9 L67.9 266.2 L77.5 293.9 L96.8 311.3 L120.5 316.9 L127.9 329.7 L123.6 344.4 L93.3 371.5 L86.2 401.8 L89.8 415.1 L80.7 433.4 L81.3 447.8 L125.1 426.2 L136.4 413.3 L164.6 421.0 L169.1 424.7 L171.9 446.8 L197.5 477.8 L207.3 501.2 L154.1 544.0 L92.2 560.6 L64.0 581.5 L64.0 581.5 L71.2 587.4 L124.8 583.5 L138.2 599.0 L129.3 632.8 L142.5 644.2 L126.7 661.7 L132.1 700.0 L123.5 697.8 L125.7 710.1 L141.0 723.0 L185.5 725.8 L200.9 734.4 L221.2 733.2 L251.3 750.0 L211.3 810.0 L-260 770.0 L-260 10.0 L106.4 -20.0 Z" fill="#dccfb0" stroke="#2b1d0e" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M166.4 50.0 L139.4 55.0 L135.2 84.3 L122.7 98.9 L120.3 112.7 L126.2 116.5 L127.1 129.1 L145.8 164.1 L136.4 189.2 L127.0 188.6 L116.6 205.4 L84.4 204.1 L90.7 221.0 L90.2 236.9 L67.9 266.2 L77.5 293.9 L96.8 311.3 L120.5 316.9 L127.9 329.7 L123.6 344.4 L93.3 371.5 L86.2 401.8 L89.8 415.1 L80.7 433.4 L81.3 447.8 L125.1 426.2 L136.4 413.3 L164.6 421.0 L169.1 424.7 L171.9 446.8 L197.5 477.8 L207.3 501.2 L154.1 544.0 L92.2 560.6 L64.0 581.5 L64.0 581.5 L71.2 587.4 L124.8 583.5 L138.2 599.0 L129.3 632.8 L142.5 644.2 L126.7 661.7 L132.1 700.0 L123.5 697.8 L125.7 710.1 L141.0 723.0 L185.5 725.8 L200.9 734.4 L221.2 733.2 L251.3 750.0 L211.3 810.0 L-260 770.0 L-260 10.0 L106.4 -20.0 Z" fill="url(#ruinas)" stroke="none" pointer-events="none"/>
    <g fill="#2b1d0e" text-anchor="middle" pointer-events="none">
      <text x="-95" y="335" font-size="20" font-style="italic" font-family="'Cinzel', serif" letter-spacing="2">DORNHAL</text>
      <text x="-95" y="356" font-size="12" fill="#6e5a45" font-style="italic">reino vencido en la guerra</text>
      <text x="-95" y="372" font-size="12" fill="#6e5a45" font-style="italic">de 1207 a 1210</text>
    </g>
    <!-- capital en ruinas -->
    <g transform="translate(-110 440)" pointer-events="none">
      <path d="M-10 6 L-10 -8 L-4 -8 L-4 -2 L2 -2 L2 -12 L8 -12 L8 6 Z" fill="none" stroke="#2b1d0e" stroke-width="1.3"/>
      <text x="0" y="24" font-size="12" text-anchor="middle" font-style="italic" fill="#2b1d0e">Ruinas de Velmoor</text>
    </g>
  </g>

  <!-- contorno del reino -->
  <path id="reino" d="M64.0 581.5 L71.2 587.4 L124.8 583.5 L138.2 599.0 L129.3 632.8 L142.5 644.2 L126.7 661.7 L132.1 700.0 L123.5 697.8 L125.7 710.1 L141.0 723.0 L185.5 725.8 L200.9 734.4 L221.2 733.2 L251.3 750.0 L285.6 739.3 L334.6 742.3 L342.2 718.5 L360.9 700.7 L364.0 684.4 L358.5 668.1 L371.8 653.2 L388.4 653.7 L410.6 684.9 L420.6 685.2 L440.7 649.6 L477.0 631.2 L499.6 642.4 L544.8 640.0 L567.0 649.8 L572.3 638.3 L581.8 633.3 L591.6 638.1 L605.7 631.3 L616.7 636.4 L631.4 632.0 L646.7 615.1 L646.2 600.7 L651.8 598.2 L651.2 586.5 L660.0 562.6 L704.6 552.8 L734.3 564.4 L748.9 555.0 L778.8 522.7 L779.6 491.3 L775.2 483.4 L786.8 475.0 L784.6 461.9 L788.0 451.1 L790.3 455.9 L792.3 452.9 L783.3 394.0 L788.1 386.1 L781.7 389.3 L785.2 361.6 L799.9 331.4 L842.9 319.0 L876.0 275.3 L852.5 249.6 L823.3 265.2 L803.3 266.7 L784.4 264.6 L756.9 250.5 L728.8 255.2 L716.0 210.1 L721.3 211.0 L727.7 169.6 L719.7 157.8 L713.8 163.8 L694.7 160.3 L679.6 169.6 L649.9 149.0 L636.5 152.3 L619.2 144.8 L602.1 159.4 L589.3 157.9 L584.0 165.9 L567.3 160.1 L557.2 144.0 L522.8 138.8 L516.7 132.3 L493.5 143.5 L449.5 141.3 L443.1 135.4 L419.1 142.8 L399.9 121.6 L375.3 117.8 L360.1 107.3 L344.2 76.2 L327.1 73.4 L312.1 59.1 L301.5 62.5 L280.4 50.6 L244.7 64.1 L232.7 57.9 L219.2 63.3 L212.0 73.1 L176.7 71.8 L166.4 50.0 L139.4 55.0 L135.2 84.3 L122.7 98.9 L120.3 112.7 L126.2 116.5 L127.1 129.1 L145.8 164.1 L136.4 189.2 L127.0 188.6 L116.6 205.4 L84.4 204.1 L90.7 221.0 L90.2 236.9 L67.9 266.2 L77.5 293.9 L96.8 311.3 L120.5 316.9 L127.9 329.7 L123.6 344.4 L93.3 371.5 L86.2 401.8 L89.8 415.1 L80.7 433.4 L81.3 447.8 L125.1 426.2 L136.4 413.3 L164.6 421.0 L169.1 424.7 L171.9 446.8 L197.5 477.8 L207.3 501.2 L154.1 544.0 L92.2 560.6 L64.0 581.5 Z"
        fill="#ece0c4" stroke="#2b1d0e" stroke-width="2" stroke-linejoin="round" filter="url(#sombra)"/>


  <!-- frontera con Dornhal (línea punteada sobre el contorno) -->
  <path id="frontera" d="M166.4 50.0 L139.4 55.0 L135.2 84.3 L122.7 98.9 L120.3 112.7 L126.2 116.5 L127.1 129.1 L145.8 164.1 L136.4 189.2 L127.0 188.6 L116.6 205.4 L84.4 204.1 L90.7 221.0 L90.2 236.9 L67.9 266.2 L77.5 293.9 L96.8 311.3 L120.5 316.9 L127.9 329.7 L123.6 344.4 L93.3 371.5 L86.2 401.8 L89.8 415.1 L80.7 433.4 L81.3 447.8 L125.1 426.2 L136.4 413.3 L164.6 421.0 L169.1 424.7 L171.9 446.8 L197.5 477.8 L207.3 501.2 L154.1 544.0 L92.2 560.6 L64.0 581.5 L64.0 581.5 L71.2 587.4 L124.8 583.5 L138.2 599.0 L129.3 632.8 L142.5 644.2 L126.7 661.7 L132.1 700.0 L123.5 697.8 L125.7 710.1 L141.0 723.0 L185.5 725.8 L200.9 734.4 L221.2 733.2 L251.3 750.0" fill="none" stroke="#8a2f1f" stroke-width="2.5" stroke-dasharray="7 5" stroke-linecap="round" pointer-events="none"/>

  <!-- montañas del norte, decorativas -->
  <g fill="none" stroke="#2b1d0e" stroke-opacity=".5" stroke-width="1.2" pointer-events="none">
    <path d="M300 200 l14 -22 l14 22 M340 175 l14 -22 l14 22 M385 190 l14 -22 l14 22 M430 165 l14 -22 l14 22 M480 185 l14 -22 l14 22 M530 210 l14 -22 l14 22 M585 235 l14 -22 l14 22 M640 220 l14 -22 l14 22 M700 250 l14 -22 l14 22"/>
    <path d="M230 300 l12 -18 l12 18 M500 300 l12 -18 l12 18 M760 380 l12 -18 l12 18"/>
  </g>

  <!-- río, decorativo -->
  <path d="M470 250 C440 330 380 380 330 430 C280 480 250 520 262 570 C270 610 240 660 220 700"
        fill="none" stroke="#2f4a6d" stroke-opacity=".55" stroke-width="2" pointer-events="none"/>
  <path d="M640 380 C600 420 520 470 470 500 C420 530 380 540 340 535"
        fill="none" stroke="#2f4a6d" stroke-opacity=".45" stroke-width="1.5" pointer-events="none"/>

  <!-- capa para las ciudades -->
  <g id="ciudades"></g>

  <!-- rosa de los vientos -->
  <g transform="translate(860 90)" fill="#2b1d0e" stroke="#2b1d0e" pointer-events="none">
    <circle r="28" fill="none" stroke-width="1"/>
    <path d="M0 -40 L6 0 L0 40 L-6 0 Z" stroke="none"/>
    <path d="M-40 0 L0 6 L40 0 L0 -6 Z" stroke="none" fill-opacity=".45"/>
    <text y="-46" font-size="14" text-anchor="middle" stroke="none" font-family="'Cinzel', serif">N</text>
  </g>

  <!-- cartela -->
  <g transform="translate(640 700)" pointer-events="none">
    <rect width="260" height="60" fill="#f3e9d2" stroke="#2b1d0e" stroke-width="1"/>
    <rect x="4" y="4" width="252" height="52" fill="none" stroke="#2b1d0e" stroke-opacity=".4" stroke-width="1"/>
    <text x="130" y="26" font-size="16" text-anchor="middle" font-family="'Cinzel', serif" fill="#2b1d0e">REINO DE CREGON</text>
    <text x="130" y="45" font-size="12" text-anchor="middle" font-style="italic" fill="#6e5a45">carta de las ciudades, año 1218</text>
  </g>
</svg>
